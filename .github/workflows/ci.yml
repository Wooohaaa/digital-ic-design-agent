name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      # Keep subprocess coverage artifacts out of temporary engineering workspaces.
      COVERAGE_FILE: ${{ github.workspace }}/.coverage
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install package and test tools
        run: uv sync --locked --all-extras --python ${{ matrix.python }}
      - name: Run Python tests with coverage
        run: uv run --locked --all-extras --python ${{ matrix.python }} pytest --cov=fpga_agent --cov-report=term-missing --cov-report=xml
      - name: Build wheel
        run: uv build --wheel --python ${{ matrix.python }}

  hdl-fixtures:
    name: HDL fixtures / Icarus + Verilator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install HDL tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes iverilog verilator
          iverilog -V
          verilator --version
      - name: Install IC Forge
        run: uv sync --locked --all-extras --python 3.12
      - name: Verify trusted fixtures
        run: |
          for project in sync_fifo spi_master apb_pwm_timer; do
            uv run --locked python -m fpga_agent verify "examples/agent_validation/$project"
            uv run --locked python -m fpga_agent lint "examples/agent_validation/$project"
          done
