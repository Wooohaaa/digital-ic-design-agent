[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hx1p35a-fpga-agent"
version = "0.5.1"
description = "AI-assisted RTL to simulation and Anlogic TD implementation flow for HX1P35A"
requires-python = ">=3.11"
dependencies = ["textual>=8.2.8,<9", "rich>=13.3.3,<16"]

[project.optional-dependencies]
tinyllm = ["numpy>=2,<3", "pyserial>=3.5,<4"]

[project.scripts]
fpga-agent = "fpga_agent.cli:main"
icforge = "fpga_agent.cli:main"
ic-forge = "fpga_agent.cli:main"

[tool.setuptools]
packages = ["fpga_agent"]
include-package-data = true

[tool.setuptools.package-data]
fpga_agent = ["templates/**/*", "*.tcss"]
