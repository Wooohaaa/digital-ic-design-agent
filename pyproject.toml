[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hx1p35a-fpga-agent"
version = "0.2.0"
description = "AI-assisted RTL to simulation and Anlogic TD implementation flow for HX1P35A"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fpga-agent = "fpga_agent.cli:main"

[tool.setuptools]
packages = ["fpga_agent"]
include-package-data = true

[tool.setuptools.package-data]
fpga_agent = ["templates/**/*"]
